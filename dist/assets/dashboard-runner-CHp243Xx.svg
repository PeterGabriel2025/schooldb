<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" fill="none">
  <style>
    .runner {
      animation: run-to-school 7s ease-in-out infinite;
    }

    .runner-front-arm {
      transform-box: fill-box;
      transform-origin: 0% 50%;
      animation: arm-swing .48s ease-in-out infinite alternate;
    }

    .runner-back-arm {
      transform-box: fill-box;
      transform-origin: 100% 50%;
      animation: arm-swing .48s ease-in-out infinite alternate-reverse;
    }

    .runner-front-leg {
      transform-box: fill-box;
      transform-origin: 0% 0%;
      animation: leg-swing .48s ease-in-out infinite alternate;
    }

    .runner-back-leg {
      transform-box: fill-box;
      transform-origin: 100% 0%;
      animation: leg-swing .48s ease-in-out infinite alternate-reverse;
    }

    @keyframes run-to-school {
      0% { opacity: 0; transform: translateX(0); }
      8% { opacity: 1; }
      78% { opacity: 1; transform: translateX(88px); }
      94% { opacity: .8; transform: translateX(102px); }
      99%, 100% { opacity: 0; transform: translateX(102px); }
    }

    @keyframes arm-swing {
      from { transform: rotate(-24deg); }
      to { transform: rotate(25deg); }
    }

    @keyframes leg-swing {
      from { transform: rotate(-22deg); }
      to { transform: rotate(22deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .runner,
      .runner-front-arm,
      .runner-back-arm,
      .runner-front-leg,
      .runner-back-leg {
        animation: none;
      }

      .runner {
        opacity: .9;
      }
    }
  </style>
  <defs>
    <linearGradient id="sky" x1="360" y1="0" x2="360" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9E8FF" stop-opacity=".08"/>
      <stop offset="1" stop-color="#AFC9FF" stop-opacity=".46"/>
    </linearGradient>
    <linearGradient id="school" x1="520" y1="42" x2="680" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#D7E4FF"/>
    </linearGradient>
    <linearGradient id="uniform" x1="337" y1="69" x2="374" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2679F5"/>
      <stop offset="1" stop-color="#1444B1"/>
    </linearGradient>
    <filter id="soft-shadow" x="0" y="0" width="720" height="180" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <path d="M0 0h720v180H0z" fill="url(#sky)"/>
